<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajude - ONG Solidária</title>

    <link rel="stylesheet" href="style.css">
    <!-- Favicon da página -->
    <link rel="icon" type="image/png" href="img/favicon2.png">
</head>

<body class="pagina-ajuda">

    <header>

        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#sobre">Sobre Nós</a>
            <a href="index.html#projetos">Projetos</a>
            <a href="ajuda.html">Ajudar</a>
            <a href="index.html#contato">Contato</a>
        </nav>

    </header>


    <main>

        <h1>Faça parte dessa transformação</h1>

        <p>
            Existem várias formas de contribuir com nossas ações.
            Preencha o formulário abaixo e faça parte da nossa rede
            de apoio.
        </p>


        <form id="form-ajuda">

            <label for="nome">
                Nome completo:
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
            >

            <p
                id="mensagem-nome"
                class="mensagem-validacao"
            ></p>


            <label for="cpf">
                CPF:
            </label>

            <input
                type="text"
                id="cpf"
                name="cpf"
            >

            <p
                id="mensagem-cpf"
                class="mensagem-validacao"
            ></p>


            <label for="telefone">
                Telefone:
            </label>

            <input
                type="tel"
                id="telefone"
                name="telefone"
            >

            <p
                id="mensagem-telefone"
                class="mensagem-validacao"
            ></p>


            <label for="cep">
                CEP:
            </label>

            <input
                type="text"
                id="cep"
                name="cep"
            >

            <p
                id="mensagem-cep"
                class="mensagem-validacao"
            ></p>


            <button type="submit">
                Quero ajudar
            </button>

        </form>

    </main>


    <footer>

        <p>
            Projeto ONG • 2026
        </p>

        <p>
            Desenvolvido por Rafaela Cabral
        </p>

    </footer>


    <!-- Biblioteca AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- JavaScript responsável pela validação do formulário -->
    <script type="module" src="js/validacao.js"></script>

</body>

</html>
